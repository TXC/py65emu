name: Build & maybe upload PyPI package

on:
  push:
    branches: [master]
    tags: ["*"]
  release:
    types:
      - published
  workflow_run:
    workflows: ["Tests"]
    branches: [master]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-package:
    name: Build & verify package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: 3.15

      - name: Set Development Version
        if: github.event.action != 'published'
        run: |
          LAST_TAG=$(git rev-list --tags --no-walk --max-count=1)
          COMMITS_SINCE_TAG=$(git rev-list ${LAST_TAG}..HEAD --count)
          sed -i -E "s/^version = \"([0-9\.]+)\"$/version = \"\1-dev${COMMITS_SINCE_TAG}\"/" pyproject.toml

      - name: Set Release Version
        if: github.event.action == 'published'
        run: sed -i -E "s/^version = \"([0-9\.]+)\"$/version = \"${GITHUB_REF#refs/tags/}\"/" pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade build twine

      - name: Build package
        run: python -m build .

      - name: Check package
        run: python -m twine check dist/*

      - name: Archive artifacts
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: Packages
          path: dist

  # Upload to Test PyPI on every commit on main.
  release-test-pypi:
    name: Publish in-dev package to test.pypi.org
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build-package
    environment:
      name: testpypi
      url: https://test.pypi.org/p/py65emu

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: Packages
          path: dist

      - name: Upload package to Test PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  release-pypi:
    name: Publish released package to pypi.org
    if: github.event.action == 'published'
    runs-on: ubuntu-latest
    needs: build-package
    environment:
      name: pypi
      url: https://pypi.org/p/py65emu

    #env:
    #  DV_NEW_VERSION: ""
    #  DV_VERSION_BUMP: ""
    #  DV_CURRENT_VERSION: ""
    #  DV_DEV_VERSION: "False"

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: Packages
          path: dist

      - name: Upload package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
